name: Backend CI/CD

on:
  pull_request:
    branches:
      - dev
      - master
  push:
    branches:
      - dev
      - master

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/kakao-theme-maker/backend
  ANDROID_BUILDER_IMAGE: louie8821/android-apk-builder
  ANDROID_BUILDER_TAG: latest@sha256:80cbbfa894203da38404e052dd480e2f4b1f4aaf1f9f4d8614f912d886e1ebed

jobs:
  verify:
    name: CI verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis:6.2.6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      THEME_ANDROID_DOCKER_IMAGE: louie8821/android-apk-builder
      THEME_ANDROID_DOCKER_TAG: latest@sha256:80cbbfa894203da38404e052dd480e2f4b1f4aaf1f9f4d8614f912d886e1ebed
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Verify deployment files
        shell: bash
        run: |
          set -euo pipefail
          shellcheck docker/deploy-backend.sh docker/test/deploy-backend-test.sh
          bash docker/test/deploy-backend-test.sh

          compose_test_dir="$RUNNER_TEMP/compose-config"
          mkdir -p "$compose_test_dir"
          cp docker/docker-compose.yml "$compose_test_dir/docker-compose.yml"
          cp docker/backend.env.example "$compose_test_dir/backend.env"
          BACKEND_IMAGE="ghcr.io/kakao-theme-maker/backend@sha256:$(printf '0%.0s' {1..64})" \
            docker compose -f "$compose_test_dir/docker-compose.yml" config --quiet

      - name: Set up Java 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: Restore Android builder Gradle cache
        id: android-gradle-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ci-cache/android-gradle
          key: android-gradle-${{ runner.os }}-${{ runner.arch }}-80cbbfa894203da38404e052dd480e2f4b1f4aaf1f9f4d8614f912d886e1ebed-${{ hashFiles('src/main/resources/themeSample/android/sampleTheme.zip') }}

      - name: Prepare APK integration test
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          keystore_path="$RUNNER_TEMP/android-signing"

          mkdir -p .ci-cache/android-gradle uploads "$keystore_path"
          sudo mkdir -p /data/uploads
          sudo chown "$(id -u):$(id -g)" /data/uploads

          keytool -genkeypair \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -keystore "$keystore_path/release.jks" \
            -storepass 123456 \
            -keypass 123456 \
            -dname "CN=CI, OU=CI, O=Komentum, L=Seoul, ST=Seoul, C=KR" \
            -noprompt

          echo "THEME_ANDROID_KEYSTORE_TEST_HOST_PATH=$keystore_path" >> "$GITHUB_ENV"

          docker pull "$ANDROID_BUILDER_IMAGE:$ANDROID_BUILDER_TAG"
          docker volume create \
            --driver local \
            --opt type=none \
            --opt o=bind \
            --opt device="$GITHUB_WORKSPACE/.ci-cache/android-gradle" \
            gradle-cache

          echo "Android Gradle cache hit: ${{ steps.android-gradle-cache.outputs.cache-hit }}"

      - name: Test and build executable JAR
        run: ./gradlew test bootJar --build-cache --no-daemon

      - name: Verify deployable JAR contents
        shell: bash
        run: |
          set -euo pipefail
          jar tf build/libs/kakao-theme-maker.jar > "$RUNNER_TEMP/jar-contents.txt"
          if grep -E '(^|/)backend_config/|BOOT-INF/classes/application[^/]*\.(yml|yaml|properties)$' "$RUNNER_TEMP/jar-contents.txt"; then
            echo "Deployable JAR contains environment-specific configuration." >&2
            exit 1
          fi

      - name: Make Android cache readable
        if: always()
        shell: bash
        run: |
          sudo chown -R "$(id -u):$(id -g)" .ci-cache/android-gradle
          docker volume rm gradle-cache || true

      - name: Upload master JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-jar-${{ github.sha }}
          path: build/libs/kakao-theme-maker.jar
          if-no-files-found: error
          retention-days: 1

  publish-image:
    name: Publish ARM64 image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
      release_current: ${{ steps.current_master.outputs.current }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Download verified JAR
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: backend-jar-${{ github.sha }}
          path: build/libs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable ARM64 image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Verify image JAR and architecture
        shell: bash
        run: |
          set -euo pipefail
          image_ref="$IMAGE_NAME@${{ steps.build.outputs.digest }}"
          image_jar="$RUNNER_TEMP/image-app.jar"

          docker pull --platform linux/arm64 "$image_ref"
          test "$(docker image inspect "$image_ref" --format '{{.Architecture}}')" = "arm64"

          container_id="$(docker create --platform linux/arm64 "$image_ref")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/app/app.jar" "$image_jar"
          cmp build/libs/kakao-theme-maker.jar "$image_jar"

          artifact_sha="$(sha256sum build/libs/kakao-theme-maker.jar | cut -d ' ' -f 1)"
          image_sha="$(sha256sum "$image_jar" | cut -d ' ' -f 1)"
          echo "Artifact JAR SHA-256: $artifact_sha" >> "$GITHUB_STEP_SUMMARY"
          echo "Image JAR SHA-256: $image_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Promote current master digest to development tag
        id: current_master
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin master
          if [[ "$(git rev-parse FETCH_HEAD)" == "$GITHUB_SHA" ]]; then
            docker buildx imagetools create \
              --tag "$IMAGE_NAME:dev" \
              "$IMAGE_NAME@${{ steps.build.outputs.digest }}"
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "A newer master commit exists; keeping only the immutable SHA tag."
          fi

  deploy-development:
    name: Deploy development
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      needs.publish-image.outputs.release_current == 'true'
    needs: publish-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment:
      name: development
    concurrency:
      group: backend-development-deploy
      cancel-in-progress: false
    env:
      IMAGE_REF: ghcr.io/kakao-theme-maker/backend@${{ needs.publish-image.outputs.image_digest }}
      DEPLOY_SEQUENCE: ${{ github.run_number }}
      DEV_HOST: ${{ vars.DEV_HOST }}
      DEV_SSH_PORT: ${{ vars.DEV_SSH_PORT }}
      DEV_SSH_USER: ${{ vars.DEV_SSH_USER }}
      DEV_DEPLOY_PATH: ${{ vars.DEV_DEPLOY_PATH }}
      DEV_SSH_PRIVATE_KEY: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
      DEV_SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
    steps:
      - name: Check out deployment files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: false

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          required_names=(
            DEV_HOST
            DEV_SSH_PORT
            DEV_SSH_USER
            DEV_DEPLOY_PATH
            DEV_SSH_PRIVATE_KEY
            DEV_SSH_KNOWN_HOSTS
          )
          for name in "${required_names[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "$name is required." >&2
              exit 1
            fi
          done

          install -m 700 -d "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEV_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$DEV_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/deploy_key" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Transfer and run digest deployment
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin master
          if [[ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]]; then
            echo "A newer master commit exists; skipping stale deployment."
            exit 0
          fi

          ssh_options=(
            -i "$RUNNER_TEMP/ssh/deploy_key"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts"
            -p "$DEV_SSH_PORT"
          )
          ssh_target="$DEV_SSH_USER@$DEV_HOST"
          printf -v quoted_deploy_path '%q' "$DEV_DEPLOY_PATH"
          printf -v quoted_image_ref '%q' "$IMAGE_REF"
          printf -v quoted_deploy_sequence '%q' "$DEPLOY_SEQUENCE"

          tar -C docker -cf - deploy-backend.sh docker-compose.yml \
            | ssh "${ssh_options[@]}" "$ssh_target" \
                "mkdir -p -- $quoted_deploy_path && tar -C $quoted_deploy_path -xf -"

          ssh "${ssh_options[@]}" "$ssh_target" \
            "cd $quoted_deploy_path && chmod 700 ./deploy-backend.sh && DEPLOY_SEQUENCE=$quoted_deploy_sequence ./deploy-backend.sh $quoted_image_ref"
