name: "${COMPOSE_PROJECT_NAME:?COMPOSE_PROJECT_NAME is required}"

services:
  backend:
    image: "${BACKEND_IMAGE:?BACKEND_IMAGE is required}"
    platform: linux/arm64
    restart: unless-stopped
    env_file:
      - ${COMPOSE_ENV_FILE:-backend.env}
    ports:
      - "${BACKEND_BIND_ADDRESS:?BACKEND_BIND_ADDRESS is required}:${BACKEND_PORT:?BACKEND_PORT is required}:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://database:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    volumes:
      - type: bind
        source: "${BACKEND_CONFIG_DIR:?BACKEND_CONFIG_DIR is required}/dev/monolithic/application.yml"
        target: /app/config/application.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${BACKEND_CONFIG_DIR:?BACKEND_CONFIG_DIR is required}/dev/monolithic/application-${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE is required}.yml"
        target: /app/config/application-${SPRING_PROFILES_ACTIVE:?SPRING_PROFILES_ACTIVE is required}.yml
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_ROOT_HOST: ${MYSQL_ROOT_HOST:?MYSQL_ROOT_HOST is required}
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:6.2.6-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    volumes:
      - ./docker_redis/data:/data
      - ./docker_redis/config:/usr/local/etc/redis/redis.conf

volumes:
  mysql_data:
