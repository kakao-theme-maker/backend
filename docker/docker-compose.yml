services:
  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must be an immutable image digest}
    platform: linux/arm64
    container_name: backend
    restart: unless-stopped
    env_file:
      - backend.env
    ports:
      - "28080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

  database:
    image: mysql:8.0
    container_name: database
    restart: unless-stopped
    env_file:
      - backend.env
    ports:
      - "23306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:6.2.6-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    restart: unless-stopped
    volumes:
      - ./docker_redis/data:/data
      - ./docker_redis/config:/usr/local/etc/redis/redis.conf

volumes:
  mysql_data:
