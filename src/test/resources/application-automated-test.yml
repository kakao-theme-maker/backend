spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: test
    password: test
  jpa:
    hibernate:
      dialect: org.hibernate.dialect.H2Dialect
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
        user_sql_comments: true
  data:
    redis:
      host: localhost
      port: 6379
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: http://localhost:8080/login/oauth2/code/kakao
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - profile_image
              - account_email
            client-name: kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: dGVzdHRlc3R0ZXN0dGVzdHRlc3R0ZXN0dGVzdHRlc3R0ZXN0dGVzdHRlc3R0ZXN0dGVzdHRlc3R0ZXN0dGVzdA==

security:
  permit-all:
    GET:
      - pattern: /actuator/health
      - pattern: /api/theme-boards
    POST:
      - pattern: /api/auth/local/sign-up
      - pattern: /api/auth/local/sign-in
      - pattern: /api/auth/reissue
  admin-only:
    POST:
      - pattern: /api/themes/default/seed
  allowed-origin-list:
    - http://localhost:3000

test-user:
  user-email: test@example.com
  password: test-password
  public-user-id: 00000000-0000-0000-0000-000000000001

file:
  base-url: http://localhost:8080
  storage: local

auth:
  access-token-expires-in: 360000
  refresh-token-expires-in: 360000
  oauth2-redirect-url: http://localhost:3000
  with-https: false

theme:
  android:
    docker:
      image: louie8821/android-apk-builder
      tag: latest@sha256:80cbbfa894203da38404e052dd480e2f4b1f4aaf1f9f4d8614f912d886e1ebed
    signing:
      key-alias: ${THEME_ANDROID_KEY_ALIAS:release}
      keystore-password: ${THEME_ANDROID_KEYSTORE_PASSWORD:123456}
      key-password: ${THEME_ANDROID_KEY_PASSWORD:123456}
      keystore-host-path: ${THEME_ANDROID_KEYSTORE_TEST_HOST_PATH:${user.dir}/build/test-keystore}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: never
      show-details: never
  health:
    redis:
      enabled: false
