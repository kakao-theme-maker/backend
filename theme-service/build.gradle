plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.3'
    id 'application'
}

group = 'com.kakao'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
    implementation 'com.mysql:mysql-connector-j'

    // aws s3 api
    implementation 'com.amazonaws:aws-java-sdk-s3:1.12.782'

    // lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.7.0'

    // test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.mockito:mockito-inline:5.2.0'
    // test : h2 database
    testImplementation 'com.h2database:h2'
    // test : java-faker
    testImplementation ('com.github.javafaker:javafaker:1.0.2') { exclude module: 'snakeyaml' }
    testImplementation group: 'org.yaml', name: 'snakeyaml', version: '2.2'
}


tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('copyConfig', Copy){
    from("${rootProject.projectDir}/backend_config/dev/theme-service"){
        include "application.yml"
    }
    into "${projectDir}/src/main/resources"
}

tasks.register('copyTestConfig', Copy){
    from ("${rootProject.projectDir}/backend_config/dev/theme-service"){
        include 'application-test.yml'
    }
    into "${projectDir}/src/test/resources"
}
processTestResources.dependsOn(copyTestConfig)
processResources.dependsOn(copyConfig)